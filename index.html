/* 把 --heat 注册成可动画的自定义属性：换句时整站配色是"流"过去的，不是硬切 */
@property --heat{syntax:'<number>';inherits:true;initial-value:0}
:root{
  --bg:#05060a;
  --fg:#c9d4e5;
  --dim:#5c6a82;
  --cyan:#6ee7ff;
  --pink:#ff5aa8;
  --amber:#ffc857;
  --green:#7ee787;
  --violet:#b48cff;
  --red:#ff4d5e;
  /* ── 强度引擎 ─────────────────────────────────────────────
     每句歌词有一个 0–1 的热度（HEAT 数组）。
     色相 196°(青蓝) → 360°(红)，而且饱和度和亮度同时抬升：
     低热是又深又闷的蓝，高热是又亮又烫的红 —— 拉开的不仅是色相。
     --heat 带 .95s 过渡，所以换句时整站配色会平滑地淌过去。 */
  --heat: 0.14;
  --accent-h: calc(196 + var(--heat) * 164);
  --accent-s: calc(68% + var(--heat) * 32%);
  --accent-l: calc(42% + var(--heat) * 30%);
  --accent: hsl(var(--accent-h) var(--accent-s) var(--accent-l));
  --accent-dim: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .50);
  --accent-faint: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .20);
  --line: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .20);
  /* 拉丁部分用内嵌字体保证处处等宽；中日韩退回系统等宽字（NSimSun 每个汉字恰好 1em 宽） */
  --mono:'WEM Mono','Cascadia Mono','Sarasa Mono SC','更纱黑体 Mono SC',
         'Noto Sans Mono CJK SC','Noto Sans Mono','NSimSun','MS Gothic',
         Consolas,'DejaVu Sans Mono','Courier New',monospace;
  --fs-code:14.2px;
  --fs-body:14.5px;
  /* 注意：这里曾经给 --heat 加过 .6s 过渡，实现"配色淌过去"。
     但 step 模式下 0..i 的卡片全部 display:''（约 65 张、2000 多个 SVG 元素），
     过渡意味着这些元素每帧都要重算样式 —— 36 帧 × 2000 元素，直接卡死。
     现在改成瞬时切换：仍然只算一次，配色依然随句变化。 */
}
/* 整页色调：上下两片随热度浓淡的颜色雾。不再挂 will-change ——
   那会把整屏固定成一个常驻合成层（约 8MB），收益不抵代价。 */
#glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(125% 85% at 50% -12%, var(--accent) 0%, transparent 58%),
    radial-gradient(125% 85% at 50% 112%, var(--accent) 0%, transparent 58%);
  opacity:calc(.12 + var(--heat) * .22);
}
*{box-sizing:border-box}
/* 关键：浏览器 UA 样式表给 pre/code/textarea 等直接写了 font-family:monospace，
   它命中元素本身，会盖掉从 body 继承下来的 --mono 字体栈。
   不显式声明的话，内嵌字体根本轮不到代码区。 */
pre,code,kbd,samp,textarea,input,select,button{font-family:var(--mono)}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1100px 620px at 12% -12%, var(--accent-faint), transparent 62%),
    radial-gradient(900px 520px at 92% 112%, var(--accent-faint), transparent 62%),
    linear-gradient(180deg,#05060a,#080b13 42%,#05060a);
  color:var(--fg);
  font-family:var(--mono);
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(110,231,255,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(110,231,255,.055) 1px,transparent 1px);
  background-size:38px 38px;
  -webkit-mask-image:radial-gradient(closest-side at 50% 42%,#000,transparent 88%);
  mask-image:radial-gradient(closest-side at 50% 42%,#000,transparent 88%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.15;
  background:repeating-linear-gradient(rgba(0,0,0,.55) 0 1px,transparent 1px 3px);
}

/* ============ header ============ */
header{
  position:relative;z-index:3;flex:0 0 auto;
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding:16px 26px 13px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(5,6,10,.94),rgba(5,6,10,.55));
  backdrop-filter:blur(9px);
  box-shadow:inset 0 -30px 60px -40px var(--accent);
}
h1{margin:0;font-size:clamp(17px,2.1vw,25px);font-weight:600;letter-spacing:.4px;white-space:nowrap}
h1 .w1{color:var(--violet)}
h1 .p{color:var(--dim)}
h1 .w2{color:var(--accent);text-shadow:0 0 calc(18px + var(--heat) * 34px) var(--accent-dim)}
h1 .arg{color:var(--amber)}
h1 .semi{color:var(--pink)}
h1 .caret{display:inline-block;width:9px;height:1.05em;background:var(--cyan);vertical-align:-2px;margin-left:2px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.meta{font-size:12.5px;color:var(--dim);line-height:1.8}
.meta b{color:var(--cyan);font-weight:500}
.meta.right{text-align:right}

/* ============ stage ============ */
#stage{
  position:relative;z-index:2;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:30px 20px 46px;scroll-behavior:smooth;
}
#stage::-webkit-scrollbar{width:10px}
#stage::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}
#stage::-webkit-scrollbar-thumb{background:rgba(110,231,255,.22);border-radius:9px;border:2px solid transparent;background-clip:content-box}
#stage::-webkit-scrollbar-thumb:hover{background:rgba(110,231,255,.45);background-clip:content-box}

/* 尾部留白：让最后几张卡也能把顶部滚到滚动区顶端，不被 max-scroll 夹住 */
#cards::after{content:"";display:block;height:36vh}

.card{
  position:relative;
  display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.28fr);
  gap:26px;
  max-width:1340px;margin:0 auto 28px;padding:28px 26px 24px;
  border:1px solid var(--line);border-radius:16px;
  /* 卡片本身也被染上当前色调：深色底 + 一层随热度加深的颜色 */
  background:linear-gradient(158deg,#101624,#090c14);
  transition:opacity .45s ease,transform .45s ease,border-color .45s ease,box-shadow .45s ease;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:linear-gradient(158deg,var(--accent) 0%,transparent 68%);
  opacity:calc(.04 + var(--heat) * .10);
}
/* 过去的卡片只降不透明度。原来还加了 filter:saturate(.45) ——
   每张卡都会被强制单独光栅化成一个合成层，65 张就是约 160MB 显存。 */
.card.past{opacity:.2}
.card.active{
  border-color:var(--accent-dim);
  box-shadow:0 0 0 1px var(--accent-faint),
             0 22px calc(70px + var(--heat) * 46px) -26px var(--accent-dim);
}
.idx{position:absolute;top:11px;left:16px;font-size:11.5px;letter-spacing:1.4px;color:#3f4d66}
.idx b{color:var(--cyan);font-weight:500}
.left,.right{min-width:0}
.right{position:relative;display:flex;flex-direction:column}
/* 代码超出可视高度时，底部给一条渐隐提示，滚到底自动收起 */
.right.scrollable::after{
  content:"";position:absolute;left:1px;right:9px;bottom:1px;height:38px;
  border-radius:0 0 12px 12px;pointer-events:none;transition:opacity .25s;
  background:linear-gradient(180deg,rgba(6,9,16,0),rgba(6,9,16,.97));
}
.right.at-bottom::after{opacity:0}
.en{
  font-size:clamp(19px,2.3vw,31px);line-height:1.36;
  margin:26px 0 9px;color:#eaf2ff;font-weight:600;letter-spacing:.2px;
  overflow-wrap:anywhere;                    /* 长句正常折行，超长单词也不至于溢出 */
  text-shadow:0 0 30px rgba(110,231,255,.16);
}
.zh{margin:0 0 18px;font-size:var(--fs-body);color:var(--dim);line-height:1.85;letter-spacing:.5px}
/* 注意：这里曾经有一条全局 .ch{animation:chIn…}（含 filter:blur + fill:both），
   它会把 blur(0px) 永久留在每个字符上，一个字符一层缓冲，直接拖垮整页。
   现在字符的显隐只由 .en .ch 的透明度过渡负责。 */

.viz{border:1px dashed rgba(110,231,255,.16);border-radius:12px;background:rgba(6,10,18,.62);padding:6px 8px}
.viz svg{display:block;width:100%;height:auto}
.t-dim{fill:#5c6a82;font:11px var(--mono)}
.f-dim{fill:#33455f}
.f-cyan{fill:var(--accent)} .f-pink{fill:var(--pink)} .f-amber{fill:var(--amber)}
.f-violet{fill:var(--violet)} .f-green{fill:var(--green)} .f-red{fill:var(--red)}
.s-cyan{stroke:var(--accent)} .s-pink{stroke:var(--pink)} .s-amber{stroke:var(--amber)}
.s-violet{stroke:var(--violet)} .s-green{stroke:var(--green)} .s-red{stroke:var(--red)} .s-dim{stroke:#33455f}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.22}50%{opacity:1}}
.spin{animation:spin 7s linear infinite;transform-origin:200px 90px}
@keyframes spin{to{transform:rotate(360deg)}}
.dash{stroke-dasharray:6 7;animation:dash 2.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-52}}
.f-cell{fill:rgba(110,231,255,.07);stroke:rgba(110,231,255,.28);stroke-width:1}
.f-on{fill:rgba(255,90,168,.45);stroke:var(--pink)}
.f-a{fill:rgba(110,231,255,.14)} .f-b{fill:rgba(110,231,255,.04)}
.sw{fill:rgba(110,231,255,.07);stroke:rgba(110,231,255,.3);stroke-width:1.4}
.sw-on{animation:swOn 2.8s ease-in-out infinite}
@keyframes swOn{0%,100%{fill:rgba(110,231,255,.08)}50%{fill:rgba(110,231,255,.42)}}

/* ---- code panel ---- */
.code-head{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;border:1px solid rgba(110,231,255,.16);border-bottom:none;
  border-radius:12px 12px 0 0;background:rgba(255,255,255,.028);
}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.fname{margin-left:8px;font-size:12.5px;color:#9fb0c8}
.lang{margin-left:8px;font-size:10.5px;color:#4b6b82;border:1px solid rgba(110,231,255,.22);border-radius:4px;padding:1px 5px;letter-spacing:.6px}
.ln{margin-left:auto;font-size:11.5px;color:#3f4d66}
.copy{
  font-family:var(--mono);font-size:11.5px;color:#7f93ad;background:none;
  border:1px solid rgba(110,231,255,.2);border-radius:5px;padding:2px 7px;cursor:pointer;transition:.18s
}
.copy:hover{color:#fff;border-color:rgba(110,231,255,.6);background:rgba(110,231,255,.12)}
.copy.done{color:var(--green);border-color:rgba(126,231,135,.6)}
pre.code{
  margin:0;padding:13px 14px 15px;flex:0 1 auto;
  max-height:min(48vh,420px);           /* 代码区限高内滚，长片段不再把卡片撑高 */
  border:1px solid rgba(110,231,255,.16);border-radius:0 0 12px 12px;
  background:linear-gradient(180deg,rgba(8,12,22,.94),rgba(6,9,16,.94));
  overflow:auto;font-size:var(--fs-code);line-height:1.72;tab-size:4;
  scrollbar-width:thin;scrollbar-color:rgba(110,231,255,.28) transparent;
}
pre.code::-webkit-scrollbar{height:8px;width:8px}
pre.code::-webkit-scrollbar-thumb{background:rgba(110,231,255,.2);border-radius:9px}
.cline{display:block;white-space:pre;opacity:.5}
.cline::before{
  counter-increment:ln;content:counter(ln);
  display:inline-block;width:2.8em;margin-right:16px;text-align:right;
  color:#2d3950;-webkit-user-select:none;user-select:none;
}
.card.active .cline{opacity:1}

/* 代码：逐字符"打字"，光标是扫过源码的方块 */
pre.code .ch{opacity:1}
pre.code .ch.hide{visibility:hidden}
pre.code .ch.head{
  background:var(--cyan);color:#05060a;border-radius:2px;
  box-shadow:0 0 10px rgba(110,231,255,.9);
}
.c-kw{color:#ff8ab8}
.c-type{color:#7fd8ff}
.c-const{color:var(--amber)}
.c-str{color:#a8e6a3}
.c-num{color:#c9a6ff}
.c-fn{color:#b9c9e8}
.c-anno{color:#ffa657}
.c-com{color:#465468;font-style:italic}

/* ============ motion layer ============ */
@property --bang{syntax:'<angle>';initial-value:0deg;inherits:false}

#bgc{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.34}

/* 环形跑马灯改成合成层动画：
   原来用 @property 动画 conic-gradient 的角度，会让整张卡每帧重新光栅化
   （约 60 万像素/帧）；现在只滑动一条光带，纯 transform，走合成器。 */
.card .runner{display:none}
.card.active .runner{
  display:block;position:absolute;left:1px;right:1px;top:1px;height:2px;
  overflow:hidden;border-radius:15px 15px 0 0;pointer-events:none;
}
.card.active .runner::before{
  content:"";position:absolute;top:0;left:0;height:2px;width:30%;
  background:linear-gradient(90deg,transparent,var(--cyan) 45%,var(--pink) 60%,transparent);
  animation:runBorder 3s linear infinite;
}
@keyframes runBorder{from{transform:translateX(-110%)}to{transform:translateX(360%)}}

/* 换句时自上而下扫过一道光（改用 transform，避免每帧动 top 触发布局） */
.card .scan{
  position:absolute;left:2px;right:2px;top:0;height:100%;border-radius:16px;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent 42%,rgba(110,231,255,.15) 50%,transparent 58%);
}
.card.active .scan{animation:sweep 1.25s cubic-bezier(.4,0,.2,1) 1}
@keyframes sweep{
  0%{opacity:0;transform:translateY(-100%)}
  18%{opacity:1}
  100%{opacity:0;transform:translateY(100%)}
}

/* 音频电平驱动的辉光（颜色跟随热度） */
.card::after{
  content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(120% 90% at 22% -10%,var(--accent-faint),transparent 62%);
}
.card.active::after{opacity:calc(.45 + var(--level,0) * .55);will-change:opacity}

/* ── 囚笼：真的在页面上架一组栏杆 ──
   越靠画面边缘的栏杆越粗越暗（近大远小），杆身中段有一条高光，
   所以看起来是圆的金属杆而不是色块。 */
#cage{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
#cage i{
  position:absolute;top:-2%;bottom:-2%;opacity:0;transform:scaleY(0);transform-origin:top center;
  background:linear-gradient(90deg,
    rgba(2,4,8,.55), rgba(140,190,220,.20) 34%,
    rgba(226,248,255,.46) 48%, rgba(140,190,220,.18) 62%, rgba(2,4,8,.55));
  box-shadow:0 0 22px rgba(0,0,0,.45);
}
#cage b{
  position:absolute;left:-2%;right:-2%;height:15px;opacity:0;transform:scaleX(.3);
  background:linear-gradient(180deg,
    rgba(2,4,8,.75), rgba(200,232,255,.42) 45%, rgba(2,4,8,.7));
  box-shadow:0 0 30px rgba(0,0,0,.6);
}
#cage b.cage-rail-top{top:0;transform-origin:left center}
#cage b.cage-rail-bot{bottom:0;transform-origin:right center}
/* 栏杆之间再压一层暗角，强化"被关在里面"的感觉 */
#cage::after{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .5s;
  background:radial-gradient(120% 90% at 50% 50%,transparent 42%,rgba(0,0,0,.5) 100%);
}
#cage.on::after{opacity:1}
/* 降低动态效果时不做动画，直接显示 */
#cage.on i,#cage.on b{opacity:1;transform:none}

/* ── 持续状态层：进入某几句时整页维持一种"处境" ── */
/* 隔离：除了中间一圈，其余逐渐沉入黑暗（隧道视觉，但保留内容可读） */
.fx-veil{
  position:absolute;inset:0;opacity:0;
  background:radial-gradient(circle at 50% 47%,
    transparent 0 22%, rgba(0,0,0,.42) 44%, rgba(0,0,0,.84) 76%);
}
/* 高潮/爱的色调：从底部漫上来的颜色 */
.fx-tint{
  position:absolute;inset:0;opacity:0;
  background:radial-gradient(130% 110% at 50% 108%, var(--accent) 0%, transparent 62%);
}
/* 恍惚：两层反向旋转的虚线大环。默认不转 ——
   原来 animation 是常驻的，等于让两个 2300px 大小的层永远在后台旋转。 */
.fx-trance{position:absolute;inset:0;opacity:0;overflow:hidden}
.fx-trance b{
  position:absolute;left:50%;top:48%;width:92vmax;height:92vmax;margin:-46vmax 0 0 -46vmax;
  border:2px dashed var(--accent-dim);border-radius:50%;
}
body.trance-on .fx-trance b{animation:rot 26s linear infinite}
body.trance-on .fx-trance b:nth-child(2){
  width:64vmax;height:64vmax;margin:-32vmax 0 0 -32vmax;
  animation-duration:15s;animation-direction:reverse;
}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── 演出层：按歌词内容编排的画面 ── */
.fx-dark{position:absolute;inset:0;opacity:0;background:#000;pointer-events:none}
.fx-items{position:absolute;inset:0}
/* 池元素不再挂 will-change：32 个常驻合成层的代价大于收益，
   真正动画时浏览器自己会提升。 */
.fx-item{position:absolute;display:block;opacity:0}
.fx-item.sq{background:var(--accent);border-radius:2px;box-shadow:0 0 8px var(--accent-dim)}
.fx-item.ring{border:2px solid var(--accent);border-radius:50%}
.fx-item.softring{border:1px solid var(--accent-dim);border-radius:50%}
.fx-item.stream{background:var(--accent);border-radius:1px}
.fx-item.jail{background:linear-gradient(180deg,var(--accent-dim),transparent 88%);border-radius:2px}
.fx-item.panel{background:#04060b;box-shadow:0 0 60px var(--accent-dim)}
.fx-item.x{background:
  linear-gradient(45deg,transparent 45%,var(--red) 45% 55%,transparent 55%),
  linear-gradient(-45deg,transparent 45%,var(--red) 45% 55%,transparent 55%)}
.fx-item.num{font:600 76px/1 var(--mono);color:var(--accent);text-align:center;
  text-shadow:0 0 34px var(--accent-dim)}

/* 眩晕：整页模糊。filter 是静态的（不逐帧动画），只光栅化一次 */
#stage{transition:filter .38s ease}
#stage.fx-blur{filter:blur(7px) saturate(1.6) hue-rotate(14deg)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx-flash{
  position:absolute;inset:0;opacity:0;
  background:radial-gradient(62% 58% at 50% 44%,var(--accent-dim),transparent 72%);
}
.fx-whip{
  position:absolute;top:0;bottom:0;left:0;width:32%;opacity:0;filter:blur(4px);
  background:linear-gradient(90deg,transparent,var(--accent-dim) 42%,rgba(255,255,255,.22) 50%,var(--accent-dim) 58%,transparent);
}
/* CRT 撕裂条：用 steps 缓动做出数字故障的硬跳 */
.fx-bars{
  position:absolute;inset:-12% 0;opacity:0;
  background:repeating-linear-gradient(180deg,
    transparent 0 7px, var(--accent-dim) 7px 8px, transparent 8px 24px);
}
/* 网格：模拟启动时铺开 */
.fx-grid{
  position:absolute;inset:0;opacity:0;
  background-image:
    linear-gradient(var(--accent-faint) 1px,transparent 1px),
    linear-gradient(90deg,var(--accent-faint) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(closest-side at 50% 48%,#000,transparent 92%);
          mask-image:radial-gradient(closest-side at 50% 48%,#000,transparent 92%);
}

/* 非当前卡不再跑 SVG 动画。原来用 animation-play-state:paused，
   但暂停的动画依然在动画列表里被处理；直接 animation:none 更省。 */
.card:not(.active) .viz svg *{animation:none}
/* 标签页切到后台时全站暂停 */
body.page-hidden *{animation-play-state:paused!important}

/* SVG：填充图形围绕自身中心缩放 */
.viz svg rect,.viz svg circle,.viz svg ellipse{transform-box:fill-box;transform-origin:center}

/* 代码打字机由 JS 驱动（见 typeCode），此处只保留 token 配色 */

/* 歌词：乱码解码 */
/* 字符落定时只做透明度过渡。原来用的是 chIn 关键帧动画（含 filter:blur），
   而 fill:both 会把 blur(0px) 永久留在每个字符上 —— 每个字符都会渲染进
   自己的一层缓冲，几十张卡累计上千层。这是上一轮卡顿的真正来源。 */
.en .ch{opacity:0;transition:opacity .2s ease}
.en .ch.live{opacity:1;color:var(--accent);text-shadow:0 0 14px var(--accent-dim)}
.en .ch.done{opacity:1;transition:opacity .2s ease}

/* 译文：从左往右擦出 */
.zh{clip-path:inset(0 100% 0 0)}
.card.active .zh{animation:zhWipe .72s cubic-bezier(.3,0,.2,1) .18s both}
@keyframes zhWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* 进度条彗星头 */
.fill::after{
  content:"";position:absolute;right:-2px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 12px 3px rgba(110,231,255,.85);animation:comet 1.8s ease-in-out infinite;
}
@keyframes comet{50%{transform:scale(1.42);opacity:.78}}

/* 标题偶发故障 */
h1.glitch{animation:glitch .46s steps(2) 1}
@keyframes glitch{
  0%{text-shadow:none;transform:none}
  25%{text-shadow:-2px 0 var(--pink),2px 0 var(--cyan);transform:translateX(1px)}
  50%{text-shadow:2px 0 var(--pink),-2px 0 var(--cyan);transform:translateX(-1px)}
  75%{text-shadow:-1px 0 var(--cyan);transform:none}
  100%{text-shadow:none}
}

@media (prefers-reduced-motion: reduce){
  .card.active .runner,.card.active .scan,
  .card.active .zh,.fill::after,h1.glitch{animation:none!important}
  .cline{opacity:1!important;transform:none!important}
  pre.code .ch{visibility:visible!important;background:none!important;color:inherit!important;box-shadow:none!important}
  .en .ch{opacity:1!important}
  .zh{clip-path:none!important}
  #bgc{display:none}
}

/* ============ audio bar ============ */
.audio-bar{
  position:relative;z-index:3;flex:0 0 auto;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 22px;border-bottom:1px solid var(--line);
  background:rgba(8,11,18,.72);backdrop-filter:blur(8px);
  font-size:12.5px;color:var(--dim);
}
.audio-bar .spacer{flex:1 1 auto}
.btn.small{padding:6px 11px;font-size:12.5px}
.btn.on{color:#05060a;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 20px -4px var(--cyan)}
.afile{color:#3f4d66;letter-spacing:.3px}
.afile.ok{color:var(--cyan)}
#spec{border:1px solid rgba(110,231,255,.2);border-radius:6px;background:rgba(6,10,18,.7);display:block}
#spec[hidden]{display:none}
.tstamp{font-size:11px;color:#4b6a86;letter-spacing:.4px;margin-left:auto;white-space:nowrap}
.tstamp.tapped{color:var(--amber)}
.ln{margin-left:0}
body.dragging::before{
  background-image:
    linear-gradient(rgba(110,231,255,.20) 1px,transparent 1px),
    linear-gradient(90deg,rgba(110,231,255,.20) 1px,transparent 1px);
}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);
  background:rgba(10,16,28,.95);border:1px solid rgba(110,231,255,.45);
  color:var(--cyan);font-family:var(--mono);font-size:12px;letter-spacing:.5px;
  padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;box-shadow:0 10px 40px -12px rgba(110,231,255,.6);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ footer ============ */
footer{
  position:relative;z-index:3;flex:0 0 auto;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 22px 15px;border-top:1px solid var(--line);
  background:rgba(5,6,10,.88);backdrop-filter:blur(9px);
}
.btn{
  font-family:var(--mono);font-size:13.5px;color:var(--fg);
  background:rgba(110,231,255,.05);border:1px solid rgba(110,231,255,.24);
  border-radius:9px;padding:8px 13px;cursor:pointer;transition:.2s;
  letter-spacing:.5px;white-space:nowrap;
}
.btn:hover{background:rgba(110,231,255,.14);border-color:rgba(110,231,255,.55);color:#fff;box-shadow:0 0 18px -4px rgba(110,231,255,.6)}
.btn.primary{color:var(--cyan);border-color:rgba(110,231,255,.45);min-width:56px}
.track{flex:1 1 220px;height:9px;border-radius:99px;cursor:pointer;position:relative;background:rgba(255,255,255,.06);overflow:hidden;min-width:120px}
/* 整首歌的情绪曲线画在进度条里：一眼看到哪里是高潮 */
.heatcurve{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.heatcurve polyline{fill:none;stroke:var(--accent);stroke-width:1.4;vector-effect:non-scaling-stroke}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--violet),var(--pink));
  box-shadow:0 0 14px var(--accent-dim);transition:width .3s ease}
.counter{font-size:12.5px;color:var(--dim);letter-spacing:1px;min-width:78px;text-align:center}
.counter b{color:var(--cyan);font-weight:500}
.hint{font-size:11.5px;color:#3a465c;letter-spacing:.6px}

@media (max-width:980px){
  .card{grid-template-columns:1fr;gap:16px;padding:22px 16px 18px}
  .meta.right{text-align:left}
  .hint{display:none}
}
</style>
</head>
<body>
<div id="glow" aria-hidden="true"></div>
<canvas id="bgc"></canvas>

<header>
  <div>
    <h1><span class="w1">World</span><span class="p">.</span><span class="w2">execute</span><span class="p">(</span><span class="arg">me</span><span class="p">)</span><span class="semi">;</span><span class="caret"></span></h1>
    <div class="meta" style="margin-top:6px">歌词 × 代码 · 逐句对照体验 &nbsp;|&nbsp; Mili ·《Miracle Milk》</div>
  </div>
  <div class="meta right">
    86 句歌词 → 86 个 Java 模块<br>
    载入音频后 <b>按时间轴自动同步</b> · 支持打点校准
  </div>
</header>

<div class="audio-bar">
  <canvas id="spec" width="240" height="26" hidden></canvas>
  <button class="btn small" id="loadBtn">载入音频</button>
  <input type="file" id="audioFile" accept="audio/*" hidden>
  <span class="afile" id="afile">拖一个 mp3 / m4a / flac 到页面任意位置 · 原版时长会自动套用精确时间轴</span>
  <span class="spacer"></span>
  <button class="btn small" id="builtinBtn" title="LRCLIB 37237659 · Mili《Miracle Milk》212s">原版时间轴</button>
  <button class="btn small" id="lrcBtn">导入 LRC</button>
  <input type="file" id="lrcFile" accept=".lrc,.txt,.json" hidden>
  <button class="btn small" id="expBtn">导出 LRC</button>
</div>

<main id="stage"><div id="cards"></div></main>

<div id="cage" aria-hidden="true"><b class="cage-rail-top"></b><b class="cage-rail-bot"></b></div>
<div id="fx" aria-hidden="true"><i class="fx-flash"></i><i class="fx-whip"></i><i class="fx-bars"></i><i class="fx-grid"></i><i class="fx-dark"></i><i class="fx-veil"></i><i class="fx-tint"></i><div class="fx-trance"><b></b><b></b></div><div class="fx-items"></div></div>

<footer>
  <button class="btn" id="prev" aria-label="上一句">◀◀</button>

<script>
/* =========================================================
   0. 工具
   ========================================================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const poly = pts => pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
const CW = 400, CH = 180;

/* 逐行 Java 高亮：注释优先，代码段再逐个 token 着色（token 级联动画用 --td 排序） */
const TOKEN_G = new RegExp(
    '("(?:[^"\\\\]|\\\\.)*")' + '|' +
    "('(?:[^'\\\\]|\\\\.)*')" + '|' +
    '(@[A-Za-z_]\\w*)' + '|' +
    '(\\b\\d[\\d_]*(?:\\.\\d+)?[fFdDlL]?\\b)' + '|' +
    '(\\b[A-Z][A-Z0-9_]{1,}\\b)' + '|' +
    '(\\b[A-Z]\\w*\\b)' + '|' +
    '(\\b(?:if|else|for|while|do|return|new|static|void|int|long|double|float|boolean|char|byte|short|final|var|record|sealed|permits|interface|class|enum|extends|implements|public|private|protected|this|super|try|catch|finally|throw|throws|assert|instanceof|yield|switch|case|default|break|continue|import|package|synchronized|volatile|transient|native|abstract|null|true|false)\\b)' + '|' +
    '(\\b[a-z]\\w*(?=\\s*\\())',
  'g'
);

function tokenClass(m){
  if (m[1] || m[2]) return 'c-str';
  if (m[3]) return 'c-anno';
  if (m[4]) return 'c-num';
  if (m[5]) return 'c-const';
  if (m[6]) return 'c-type';
  if (m[7]) return 'c-kw';
  if (m[8]) return 'c-fn';
  return null;
}

/** 切成 [文本, 颜色类|null] 段：注释优先拿到整段，代码段再交给 tokenizer */
function splitLine(line, st){
  const parts = [];
  let buf = line;

  if (st.block){                                   // 上一行留下的块注释
    const end = buf.indexOf('*/');
    if (end === -1){ parts.push([buf, 'c-com']); return parts; }
    parts.push([buf.slice(0, end + 2), 'c-com']);
    buf = buf.slice(end + 2);
    st.block = false;
  }
  while (buf.length){
    const li = buf.indexOf('//'), bi = buf.indexOf('/*');
    if (li !== -1 && (bi === -1 || li < bi)){
      if (li > 0) parts.push([buf.slice(0, li), null]);
      parts.push([buf.slice(li), 'c-com']);        // 行注释吃掉一整行
      return parts;
    }
    if (bi !== -1){
      const end = buf.indexOf('*/', bi + 2);
      if (bi > 0) parts.push([buf.slice(0, bi), null]);
      if (end === -1){
        parts.push([buf.slice(bi), 'c-com']);
        st.block = true;                           // 注释还没结束
        return parts;
      }
      parts.push([buf.slice(bi, end + 2), 'c-com']);
      buf = buf.slice(end + 2);
      continue;
    }
    parts.push([buf, null]);
    return parts;
  }
  return parts;
}

function hlLine(line, st){
  let out = '', tk = 0;
  const put = (cls, txt) => {
    out += cls
      ? '<span class="tk ' + cls + '" style="--td:' + (tk++) + '">' + esc(txt) + '</span>'
      : esc(txt);
  };

  for (const [text, cls] of splitLine(line, st)){
    if (cls){ put(cls, text); continue; }
    TOKEN_G.lastIndex = 0;
    let last = 0, m;
    while ((m = TOKEN_G.exec(text)) !== null){
      if (m.index > last) put(null, text.slice(last, m.index));   // 空格 / 标点
      put(tokenClass(m), m[0]);
      last = m.index + m[0].length;
      if (TOKEN_G.lastIndex <= m.index) TOKEN_G.lastIndex = m.index + 1;
    }
    if (last < text.length) put(null, text.slice(last));
  }
  return out;
}

function hl(code){
  const st = { block:false };
  return code.split('\n').map(line => hlLine(line, st));
}

            Param p = f.getAnnotation(Param.class);

/* 归一化：只留字母数字，供 LRC 文本对齐使用 */
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');

function lev(a, b){                              // 编辑距离
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = new Array(n + 1), cur = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++){
    cur[0] = i;
    for (let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    const t = prev; prev = cur; cur = t;
  }
  return prev[n];
}
const sim = (a, b) => (!a || !b) ? 0 : 1 - lev(a, b) / Math.max(a.length, b.length);

/**
 * 把任意版本的 LRC（分段不同、拼写略有出入都行）对齐到本页 86 句。
 * 对每一句向后累积最多 4 个 LRC 片段，取相似度最高的一组，
 * 用整句的起始时间，然后跳过被合并掉的片段。
 */
function alignLRC(entries){
  const N = LINES.length;
  const out = new Array(N).fill(null);
  let i = 0;
  for (let j = 0; j < entries.length && i < N; j++){
    const e = entries[j];
    if (!e || e.t == null || !norm(e.text)) continue;
    const target = norm(LINES[i].en);
    let acc = '', best = j, score = 0, k = j;
    while (k < entries.length && k - j < 4){
      if (entries[k].t != null) acc += norm(entries[k].text);
      const s = sim(acc, target);
      if (s > score){ score = s; best = k; }
      if (score > 0.985 || acc.length > target.length * 1.7) break;
      k++;
    }
    out[i] = e.t;
    i++;
    j = best;                                    // 合并掉的片段不再参与匹配
  }
  for (let z = 0; z < N; z++){
    if (out[z] == null) out[z] = z > 0 ? out[z - 1] + 0.4 : 0;
  }
  return out;
}

const fxPool = [];
let poolTimer = null, poolReady = false;
/** 延迟建池：不在脚本顶层碰 DOM，方便离线校验数据 */
function ensurePool(){
  if (poolReady) return;
  poolReady = true;
  const host = document.querySelector('.fx-items');
  if (!host) return;
  for (let i = 0; i < 32; i++){
    const el = document.createElement('i');
    el.className = 'fx-item';
    host.appendChild(el);
    fxPool.push(el);
  }
}

function poolReset(){
  ensurePool();
  clearTimeout(poolTimer);
  for (const el of fxPool){
    if (el._a){ el._a.cancel(); el._a = null; }
    el.className = 'fx-item';
    el.style.cssText = '';
    el.textContent = '';
  }
}
function poolCleanup(ms){ clearTimeout(poolTimer); poolTimer = setTimeout(poolReset, ms); }

/** 摆好一个池元素：css 直接写 left/top/width/height 等 */
function put(i, css, cls){
  ensurePool();
  const el = fxPool[i];
  el.className = 'fx-item' + (cls ? ' ' + cls : '');
  el.style.cssText = css;
  return el;
}
function fire(el, frames, opts){ el._a = el.animate(frames, opts); return el; }

    { transform: 'translate(0,0)' },

    { transform: 'translate(' + (p * .8) + 'px,' + (-p * .5) + 'px) rotate(' + (p / 40) + 'deg)' },

/* ---------- 持续状态：栏杆 / 隔离 / 恍惚 / 高潮色调 / 逐级压暗 ---------- */
const PERSIST = {};
[31, 32, 76, 77, 84, 85].forEach(n => PERSIST[n] = 'cage');
[58, 83].forEach(n => PERSIST[n] = 'isolate');
[47, 48].forEach(n => PERSIST[n] = 'trance');
[65, 66, 67, 68, 69].forEach(n => PERSIST[n] = 'climax');
[79, 80, 81, 82].forEach(n => PERSIST[n] = 'love');
[53, 54, 55, 56, 57].forEach(n => PERSIST[n] = 'dim');

let curPersist = null;
function applyPersist(i){
  const want = PERSIST[i] || null;
  if (want === curPersist) return;
  const prev = curPersist;
  curPersist = want;
  const F = fx();
  const to = (el, o, dur) => {
    if (!el) return;
    const cur = parseFloat(el.style.opacity || '0');
    if (Math.abs(cur - o) < 0.01 && el._o === o) return;   // 目标没变就别新建动画
    el._o = o;
    el.animate([{ opacity: o }], { duration: dur || 460, fill: 'both' });
  };

  cageShow(want === 'cage');
  to(F.veil,  want === 'isolate' ? 1 : 0, 560);
  to(F.tint,  want === 'climax' ? .55 : want === 'love' ? .34 : 0, 560);
  to(F.trance, want === 'trance' ? .9 : 0, 700);
  document.body.classList.toggle('trance-on', want === 'trance');
  if (want !== 'dim' && prev === 'dim') to(F.dark, 0, 420);
  if (want === 'isolate') shakeCard(2);
}

/** 每句只演一次：同一个句号连续进入不重复播放 */
let lastPerformed = -1;
function perform(i, heat){
  if (REDUCED || i === lastPerformed) return;
  lastPerformed = i;
  poolReset();
  const fn = PERFORM[i + 1];
  if (fn) fn(heat, i + 1);
}

/* ---------- 囚笼栏杆：困在模拟/困在爱里那几句，页面上真的落下栏杆 ---------- */
const CAGE_LINES = new Set([31, 32, 76, 77, 84, 85]);
let cageOn = false;

function buildCage(){
  const host = document.getElementById('cage');
  if (!host || host._built) return host;
  const COUNT = 9;
  for (let i = 0; i < COUNT; i++){
    const t = i / (COUNT - 1);                     // 0 → 1
    const edge = Math.abs(t - .5) * 2;             // 0 中心 → 1 边缘
    const w = 9 + edge * 9;                        // 边缘更粗，做出景深
    const bar = document.createElement('i');
    bar.style.left = (5 + t * 90) + '%';
    bar.style.width = w + 'px';
    bar.style.marginLeft = (-w / 2) + 'px';
    bar.style.opacity = (0.82 + edge * 0.18).toFixed(2);
    bar.style.zIndex = Math.round(edge * 10);
    host.appendChild(bar);
  }
  host._built = true;
  host._bars = [...host.querySelectorAll('i')];
  return host;
}

function cageShow(on){
  const host = buildCage();
  if (!host || on === cageOn) return;
  cageOn = on;
  host.classList.toggle('on', on);
  if (REDUCED) return;

  const bars = host._bars, mid = (bars.length - 1) / 2;
  bars.forEach((el, i) => {
    const d = Math.abs(i - mid) * 26;              // 从中间往两边依次落下
    el.animate(on
      ? [{ transform: 'scaleY(0) translateY(-26px)', opacity: 0 },
         { transform: 'scaleY(1) translateY(0)', opacity: 1 }]
      : [{ transform: 'scaleY(1)', opacity: 1 },
         { transform: 'scaleY(0) translateY(-18px)', opacity: 0 }],
      { duration: on ? 560 : 320, delay: d,
        easing: on ? 'cubic-bezier(.3,1.35,.5,1)' : 'ease-in', fill: 'both' });
  });
  host.querySelectorAll('b').forEach((el, i) => {
    el.animate(on
      ? [{ transform: 'scaleX(.3)', opacity: 0 }, { transform: 'scaleX(1)', opacity: 1 }]
      : [{ transform: 'scaleX(1)', opacity: 1 }, { transform: 'scaleX(.4)', opacity: 0 }],
      { duration: on ? 420 : 260, delay: on ? i * 70 : 0, easing: 'ease-out', fill: 'both' });
  });
  if (on) shakeCard(4);
}

/** 卡片入场：热度越高，推进感越强 */function cardEnter(el, heat, big){
  if (REDUCED) return;
  const from = big ? 'translateY(46px) scale(.955)' : 'translateY(18px) scale(.992)';
  el.animate([{ opacity: big ? 0 : .35, transform: from }, { opacity: 1, transform: 'none' }],
             { duration: big ? 820 : 420, easing: 'cubic-bezier(.16,.9,.24,1)' });
  if (heat > 0.88 && !big){          // 高潮段落每句带一下轻微震动
    el.animate([
      { transform: 'translate(0,0)' },
      { transform: 'translate(' + (-4 * heat).toFixed(1) + 'px,' + (2 * heat).toFixed(1) + 'px)' },
      { transform: 'translate(' + (3 * heat).toFixed(1) + 'px,' + (-2 * heat).toFixed(1) + 'px)' },
      { transform: 'translate(0,0)' }
    ], { duration: 150, delay: 120, iterations: 2, easing: 'linear' });
  }
}

/* =========================================================
   3. 渲染与交互
   ========================================================= */
const cardsEl = document.getElementById('cards');
const stage   = document.getElementById('stage');
const fillEl  = document.getElementById('fill');
const curEl   = document.getElementById('cur');
const totEl   = document.getElementById('tot');
const playBtn = document.getElementById('play');
const modeBtn = document.getElementById('mode');
const trackEl = document.getElementById('track');

let index = 0, playing = false, timer = null, stepMode = true, suppress = false, scrollTimer = null;
let lastActiveCard = null;
const N = LINES.length;
totEl.textContent = String(N).padStart(2,'0');

cardsEl.innerHTML = LINES.map((l, i) => {
  const svgBody = (VIZ[l.viz] || VIZ.grid)();
  const lines = hl(l.code);
  const start = 12 + (i * 13) % 180;
  const end = start + lines.length - 1;
  // 注意：.cline 是 display:block，拼接时不能夹换行符 —— <pre> 里那个 \n
  // 会真的渲染成一个空行，把代码高度翻倍
  const body = lines.map(h => '<span class="cline">' + (h.length ? h : '&nbsp;') + '</span>').join('');

  return '<article class="card" data-i="' + i + '">'
    +   '<i class="runner"></i><i class="scan"></i>'
    +   '<div class="left">'
    +     '<div class="idx"><b>' + String(i+1).padStart(2,'0') + '</b> / ' + N + '</div>'
    +     '<p class="en"></p>'
    +     '<p class="zh">' + esc(l.zh) + '</p>'
    +     '<div class="viz"><svg viewBox="0 0 ' + CW + ' ' + CH + '" preserveAspectRatio="xMidYMid meet">' + svgBody + '</svg></div>'
    +   '</div>'
    +   '<div class="right">'
    +     '<div class="code-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>'
    +       '<span class="fname">' + esc(l.file) + '</span><span class="lang">JAVA</span>'
    +       '<span class="ln">L' + start + '–' + end + ' · ' + lines.length + ' 行</span>'
    +       '<span class="tstamp" data-t="' + i + '"></span>'
    +       '<button class="copy" data-copy="' + i + '">复制</button></div>'
    +     '<pre class="code" style="counter-reset: ln ' + start + '"><code>' + body + '</code></pre>'
    +   '</div>'
    + '</article>';
}).join('');

const cards = Array.from(cardsEl.children);

/* 代码区滚到底时收起底部渐隐 */
cards.forEach(card => {
  const p = card.querySelector('pre.code');
  if (!p) return;
  p.addEventListener('scroll', () => {
    p.parentElement.classList.toggle('at-bottom',
      p.scrollTop + p.clientHeight >= p.scrollHeight - 4);
  }, {passive:true});
});

function setIndex(i, opts){
  opts = opts || {};
  const prevIdx = index;
  i = Math.max(0, Math.min(N - 1, i));
  index = i;
  const heat = HEAT[i] || 0;
  const prevHeat = HEAT[prevIdx] || 0;

  cards.forEach((c, k) => {
    c.classList.toggle('active', k === i);
    c.classList.toggle('past', k < i);
    if (stepMode) c.style.display = (k <= i) ? '' : 'none';
    else c.style.display = '';
  });

  const active = cards[i];
  if (lastActiveCard && lastActiveCard !== active && lastActiveCard._idles)
    for (const a of lastActiveCard._idles) a.pause();
  if (active._idles) for (const a of active._idles) a.play();
  setLevelOn(active);                       // --level 挂到当前卡上，避免全文档重算
  lastActiveCard = active;

  // 情绪曲线 → 整站配色 / 转场强度
  document.documentElement.style.setProperty('--heat', heat.toFixed(2));
  setBgHue(heat);
  setSpecGrad(heat);
  const kind = ACT_BREAKS[i + 1];
  if (kind) sceneFx(kind, heat);
  else if (opts.scroll !== false || i !== prevIdx) fxPunch(heat, heat - prevHeat);
  cardEnter(active, heat, !!kind);

  // 按歌词内容的演出（一次性）+ 持续状态（栏杆 / 隔离 / 恍惚 / 色调）
  perform(i, heat);
  applyPersist(i + 1);

  typeEn(active.querySelector('.en'), LINES[i].en);

  const preEl = active.querySelector('pre.code');
  if (preEl){                                   // 代码区回到顶部，并按需显示底部渐隐
    preEl.scrollTop = 0;
    preEl.parentElement.classList.toggle('scrollable', preEl.scrollHeight > preEl.clientHeight + 4);
    preEl.parentElement.classList.remove('at-bottom');
  }
  typeCode(active.querySelector('code'), LINES[i].code.length);
  animateViz(active);
  warmUp(i);

  curEl.textContent = String(i + 1).padStart(2,'0');
  fillEl.style.width = (N > 1 ? (i / (N - 1)) * 100 : 100) + '%';

  if (opts.scroll !== false){
    suppress = true;
    requestAnimationFrame(() => scrollCardToTop(active));
    clearTimeout(setIndex._t);
    setIndex._t = setTimeout(() => { suppress = false; }, 700);
  }
}

/**
 * 把卡片顶部对齐到滚动区顶部，而不是垂直居中。
 * 卡片普遍比视口高（代码很长），居中会把编号和英文歌词顶到视野外，
 * 只剩译文和 SVG —— 那正好是最该看见的一句。
 */
function scrollCardToTop(el, instant){
  const pad = 18;
  const top = Math.max(0, el.offsetTop - pad);
  if (instant) stage.scrollTop = top;                    // 深链进入时直接落位
  else stage.scrollTo({ top, behavior: 'smooth' });
}

function next(){ const i = Math.min(N - 1, index + 1); setIndex(i); seekTo(i); }
function prev(){ const i = Math.max(0, index - 1); setIndex(i); seekTo(i); }

function setPlaying(on){
  playing = on;
  playBtn.textContent = on ? '❚❚' : '▶';
  clearInterval(timer); timer = null;

  if (audioReady){                            // 有音频：音频就是时钟
    if (on){
      if (actx && actx.state === 'suspended') actx.resume();
      audio.play().catch(() => {              // 浏览器自动播放策略
        playing = false;
        playBtn.textContent = '▶';
        toast('浏览器要求先交互一次 · 点 ▶ 或按空格开始');
      });
    } else {
      audio.pause();
    }
    return;
  }
  if (on) timer = setInterval(() => {          // 无音频：按词长估时推进
    if (index >= N - 1){ setPlaying(false); return; }
    next();
  }, 6200);
}

/* =========================================================
   4. 音频同步层：拖入音频 → 歌词按时间轴跟随
   ========================================================= */
const audio     = new Audio();
audio.preload   = 'auto';
audio.crossOrigin = 'anonymous';

const specCanvas = document.getElementById('spec');
const afileEl    = document.getElementById('afile');
const tapBtn     = document.getElementById('tap');
const loopBtn    = document.getElementById('loop');

let TS = null;              // 每句开始时间（秒），长度 = N
let OFFSET = 0;             // 全局偏移：t = currentTime - OFFSET
let TAPPED = new Set();     // 已手工打点的下标
let audioReady = false, tapMode = false, loopOne = false;
let manualUntil = 0, rafId = null;
let actx = null, analyser = null, freqData = null, srcNode = null;
let levelFrame = 0, lastLevel = '', specGrad = null, spectrumDirty = false;
let bgHue = 193;

/** --level 只写在当前卡上：写在 :root 会让全文档每几帧重算一次样式 */
function setLevelOn(el){
  if (!el) return;
  lastLevel = '';
  el.style.setProperty('--level', '0');
  levelHost = el;
}
let levelHost = null;

/** 背景字符场的主色跟着热度走 */
function setBgHue(heat){
  bgHue = 193 + heat * 167;
  glyphHeat = 1 + heat * 1.6;             // 越到高潮，字符落得越快
}
let glyphHeat = 1;

/** 低频能量 → --level，驱动当前卡的辉光 */
function setLevel(v){
  const s = v.toFixed(3);
  if (s === lastLevel) return;
  lastLevel = s;
  (levelHost || document.documentElement).style.setProperty('--level', s);
}

/** 频谱柱状图的渐变随热度重建（只在换句时，不是每帧） */
function setSpecGrad(heat){
  const ctx = specCanvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, specCanvas.height);
  g.addColorStop(0, 'hsl(' + (193 + heat * 167) + ' 100% 72%)');
  g.addColorStop(1, 'hsl(' + (193 + heat * 167) + ' 100% 48% / .55)');
  specGrad = g;
}

const pad2 = n => String(n).padStart(2, '0');
const fmt = t => !isFinite(t) ? '--:--'
      : pad2(Math.floor(t / 60)) + ':' + ((t % 60) < 10 ? '0' : '') + (t % 60).toFixed(1);

let toastEl = null, toastTimer = null;
function toast(msg){
  if (!toastEl){ toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700);
}

/* ---- 时间轴：按词长把整首歌分给 86 句 ---- */
function autoSpread(){
  const dur = audio.duration;
  if (!isFinite(dur) || dur <= 0) return;
  const lead = dur * 0.055, tail = dur * 0.035;      // 前奏 / 尾奏留白
  const usable = Math.max(dur - lead - tail, 1);
  const w = LINES.map(l => l.en.length + 10);        // 长句给更多时间
  const sum = w.reduce((a, b) => a + b, 0);
  let acc = 0;
  TS = w.map(x => { const t = lead + usable * acc / sum; acc += x; return t; });
}

function lineAt(t){
  let lo = 0, hi = N - 1, ans = 0;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (TS[mid] <= t){ ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return ans;
}

function seekTo(i){
  if (!audioReady || !TS) return;
  manualUntil = performance.now() + 350;             // 手动跳转后短暂停跟随
  try { audio.currentTime = Math.max(0, TS[i] + OFFSET); } catch (e) {}
}

function saveTimeline(){
  try {
    localStorage.setItem('wem.timeline', JSON.stringify({
      ts: TS, off: OFFSET, tapped: [...TAPPED]
    }));
  } catch (e) {}
}

function loadTimeline(){
  try {
    const s = JSON.parse(localStorage.getItem('wem.timeline') || 'null');
    if (s && Array.isArray(s.ts) && s.ts.length === N){
      TS = s.ts; OFFSET = s.off || 0; TAPPED = new Set(s.tapped || []);
      return true;
    }
  } catch (e) {}
  return false;
}

/** 套用内置的 LRCLIB 精确时间轴 */
function applyBuiltin(msg){
  TS = BUILTIN.ts.slice(0, N);
  OFFSET = 0;
  TAPPED = new Set();
  saveTimeline(); renderStamps();
  if (audioReady) seekTo(index);
  toast(msg || ('已套用内置时间轴 · ' + BUILTIN.label));
}

/** 时长接近原版就自动升级为精确轴（不会覆盖你手工打过的点） */
function maybeUpgrade(){
  if (!audioReady || !TS) return false;
  if (TAPPED.size > 0) return false;
  if (Math.abs(audio.duration - BUILTIN.dur) > 6) return false;
  const same = TS.every((t, i) => Math.abs(t - BUILTIN.ts[i]) < 0.05);
  if (same) return false;
  applyBuiltin('检测到原版时长（' + fmt(audio.duration) + '）· 已换用内置精确时间轴');
  return true;
}

function renderStamps(){
  document.querySelectorAll('.tstamp').forEach(el => {
    const i = +el.dataset.t;
    if (!TS){ el.textContent = ''; return; }
    const a = TS[i] + OFFSET;
    const b = i < N - 1 ? TS[i + 1] + OFFSET : (audioReady ? audio.duration : a + 3);
    el.textContent = fmt(a) + '–' + fmt(b);
    el.classList.toggle('tapped', TAPPED.has(i));
  });
}

/* ---- 主循环：音频时间 → 当前句 ---- */
function tick(){
  rafId = requestAnimationFrame(tick);
  if (bodyHidden) return;                 // 后台标签页直接不干活
  stepGlyphs();
  drawSpectrum();
  if (!playing) setLevel(0);
  if (!audioReady || !TS) return;

  const t = audio.currentTime - OFFSET;

  if (!tapMode && performance.now() > manualUntil){
    if (loopOne){                                    // 单句循环：到句尾就跳回句首
      const end = (index < N - 1 ? TS[index + 1] : audio.duration) - 0.06;
      if (t > end) seekTo(index);
    } else {
      const i = lineAt(t);
      if (i !== index) setIndex(i, {scroll:true, follow:true});
    }
  }
  if (fillEl && audio.duration) fillEl.style.width = (audio.currentTime / audio.duration * 100) + '%';
}

function startSync(){ if (!rafId) rafId = requestAnimationFrame(tick); }

/* ---- 载入音频 ---- */
/** 音频元数据就绪后的统一收尾：时间轴决策 + 频谱 + 起播 */
function onAudioReady(label){
  audioReady = true;
  specCanvas.hidden = false;
  afileEl.textContent = label;
  afileEl.classList.add('ok');

  if (!loadTimeline() || !TS || TS.length !== N){
    if (Math.abs(audio.duration - BUILTIN.dur) < 6){
      applyBuiltin('原版时长匹配 · 已套用内置精确时间轴（' + BUILTIN.src + '）');
    } else {
      autoSpread();
      toast('已按词长估算时间轴 · 时长与原版差 ' +
            Math.abs(audio.duration - BUILTIN.dur).toFixed(0) + 's，建议按 T 打点校准');
    }
  } else {
    maybeUpgrade();
  }
  buildSpectrum();
  renderStamps();
  setIndex(0, {scroll:true});
  setPlaying(true);
}

function loadAudioFile(file){
  audio.src = URL.createObjectURL(file);
  audio.load();
  audio.addEventListener('loadedmetadata',
      () => onAudioReady(file.name + ' · ' + fmt(audio.duration)), {once:true});
}

/**
 * 同目录音频：优先 audio.mp3，其次 audio.m4a / audio.ogg。
 * 用探测元素试，避免在主 audio 上留下 error 状态；都找不到就退回无声模式。
 */
function trySidecar(){
  const candidates = ['audio.mp3', 'audio.m4a', 'audio.ogg'];
  let i = 0;
  const next = () => {
    if (i >= candidates.length){ setPlaying(true); return; }   // 没有音频：估时推进
    const url = candidates[i++];
    const probe = new Audio();
    probe.preload = 'metadata';
    probe.addEventListener('loadedmetadata', () => {
      audio.src = url;
      audio.load();
      audio.addEventListener('loadedmetadata',
          () => onAudioReady('站点音频 · ' + url + ' · ' + fmt(audio.duration)), {once:true});
    }, {once:true});
    probe.addEventListener('error', next, {once:true});
    probe.src = url;
  };
  next();
}

/**
 * 内置音频：构建脚本会注入一个 type="text/plain" 的数据块（id 为 bundledAudio），
 * 这里是把它解成 Blob 再喂给 <audio>，避免超长 data: URI 的解析开销。
 * 注意：本文件里不要出现闭合的 script 标签字面量，HTML 解析器会在那里截断脚本。
 */
function loadBundled(el){
  try {
    const b64 = (el ? el.textContent : '').replace(/\s+/g, '');
    if (b64.length < 1000){ setPlaying(true); return; }
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'audio/mpeg' });
    el.remove();                                   // 立刻释放那几 MB 文本节点
    audio.src = URL.createObjectURL(blob);
    audio.load();
    audio.addEventListener('loadedmetadata',
        () => onAudioReady('内置音频 · ' + fmt(audio.duration) + ' · ' + Math.round(bytes.length / 1048576 * 10) / 10 + 'MB'),
        {once:true});
  } catch (e){
    toast('内置音频解包失败：' + (e && e.message ? e.message : e));
    setPlaying(true);
  }
}

/* ---- 频谱 ---- */
function buildSpectrum(){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (!srcNode){
      srcNode = actx.createMediaElementSource(audio);
      analyser = actx.createAnalyser();
      analyser.fftSize = 128;
      srcNode.connect(analyser);
      analyser.connect(actx.destination);            // 必须接回扬声器
    }
    freqData = new Uint8Array(analyser.frequencyBinCount);
  } catch (e) { specCanvas.hidden = true; }
}

function drawSpectrum(){
  if (!analyser || !freqData || specCanvas.hidden || bodyHidden) return;
  if (!playing){ if (spectrumDirty){ clearSpectrum(); spectrumDirty = false; } return; }
  spectrumDirty = true;

  if (!specGrad) setSpecGrad(0);
  const ctx = specCanvas.getContext('2d');
  const w = specCanvas.width, h = specCanvas.height;
  analyser.getByteFrequencyData(freqData);
  ctx.clearRect(0, 0, w, h);
  const bars = 32, step = Math.max(1, Math.floor(freqData.length / bars));

  levelFrame++;
  if (levelFrame % 8 === 0){                        // 量化 + 降频，减少整卡重绘
    let low = 0;
    for (let i = 1; i < 6; i++) low += freqData[i] || 0;
    setLevel(Math.round(Math.min(1, low / 5 / 170) * 10) / 10);
  }

  ctx.fillStyle = specGrad;
  for (let i = 0; i < bars; i++){
    let v = 0;
    for (let j = 0; j < step; j++) v = Math.max(v, freqData[i * step + j] || 0);
    const bh = Math.max(1, v / 255 * h);
    ctx.fillRect(i * (w / bars) + 1, h - bh, w / bars - 2, bh);
  }
}

function clearSpectrum(){
  const ctx = specCanvas.getContext('2d');
  ctx.clearRect(0, 0, specCanvas.width, specCanvas.height);
}

/* ---- 打点校准 ---- */
function firstUntapped(){
  for (let i = 0; i < N; i++) if (!TAPPED.has(i)) return i;
  return N - 1;
}

function recordTap(){
  if (!audioReady || !TS){ toast('先载入音频'); return; }
  const t = Math.max(audio.currentTime - OFFSET, index > 0 ? TS[index - 1] + 0.08 : 0);
  TS[index] = t;
  TAPPED.add(index);
  for (let k = index + 1; k < N; k++){             // 保持单调
    if (TS[k] < t + 0.001 * (k - index)) TS[k] = t + 0.001 * (k - index);
  }
  saveTimeline(); renderStamps();
  toast('#' + String(index + 1).padStart(2, '0') + ' → ' + fmt(t));
  if (index < N - 1) setIndex(index + 1, {scroll:true});
}

function toggleTapMode(){
  if (!audioReady){ toast('先载入音频'); return; }
  tapMode = !tapMode;
  tapBtn.classList.toggle('on', tapMode);
  if (tapMode){
    setPlaying(false);
    const target = firstUntapped();
    setIndex(target, {scroll:true});
    seekTo(target);
    toast('打点模式：播放中，听到该句开头就按 T');
  } else {
    saveTimeline();
    toast('打点完成：已记录 ' + TAPPED.size + ' / ' + N + ' 句，已保存');
  }
}

function toggleLoop(){
  loopOne = !loopOne;
  loopBtn.classList.toggle('on', loopOne);
  toast(loopOne ? '单句循环 开' : '单句循环 关');
}

/* ---- LRC 导入 / 导出 ---- */
function loadLRC(file){
  const fr = new FileReader();
  fr.onload = () => {
    const text = String(fr.result || '');

    if (/^\s*[{[]/.test(text)){                     // JSON 时间轴
      try {
        const j = JSON.parse(text);
        const arr = Array.isArray(j) ? j : (j.ts || j.timeline);
        if (Array.isArray(arr) && arr.length >= N){
          TS = arr.slice(0, N).map(Number);
          TAPPED = new Set(TS.map((_, i) => i));
          saveTimeline(); renderStamps();
          if (audioReady) seekTo(index);
          toast('已导入 ' + N + ' 个时间点');
        } else toast('时间点不足（' + (arr ? arr.length : 0) + ' < ' + N + '）');
      } catch (e) { toast('JSON 解析失败'); }
      return;
    }

    const re = /\[(\d+):(\d+(?:[.:]\d+)?)\]/g;
    const entries = [];
    text.split(/\r?\n/).forEach(line => {
      re.lastIndex = 0;
      let m, t = null;
      while ((m = re.exec(line)) !== null){
        t = parseInt(m[1], 10) * 60 + parseFloat(m[2].replace(':', '.'));
      }
      if (t === null) return;
      entries.push({ t, text: line.replace(re, '').trim() });
    });
    if (!entries.length){ toast('没有找到 [mm:ss.xx] 时间标签'); return; }
    entries.sort((a, b) => a.t - b.t);

    TS = alignLRC(entries);                        // 按歌词文本对齐，而不是行号
    TAPPED = new Set(TS.map((_, i) => i));
    for (let i = 1; i < N; i++){                   // 保持单调递增
      if (TS[i] <= TS[i - 1]) TS[i] = TS[i - 1] + 0.3;
    }
    OFFSET = 0;
    saveTimeline(); renderStamps();
    if (audioReady) seekTo(index);
    toast('已按文本对齐 ' + entries.length + ' 行 LRC → ' + N + ' 句');
  };
  fr.readAsText(file, 'utf-8');
}

function exportLRC(){
  if (!TS){ toast('先载入音频或导入 LRC'); return; }
  const body = LINES.map((l, i) => {
    const t = Math.max(0, TS[i] + OFFSET);
    const m = Math.floor(t / 60);
    const s = (t - m * 60).toFixed(2).padStart(5, '0');
    return '[' + pad2(m) + ':' + s + ']' + l.en;
  }).join('\n');
  const url = URL.createObjectURL(new Blob([body], {type: 'text/plain;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'world-execute-me.lrc'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('已导出 LRC');
}

/* ---- 复制 ---- */
cardsEl.addEventListener('click', e => {
  const btn = e.target.closest('.copy');
  if (!btn) return;
  const code = LINES[+btn.dataset.copy].code;
  const done = () => { btn.textContent = '已复制'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('done'); }, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
  } else { fallbackCopy(code, done); }
});
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

trackEl.addEventListener('click', e => {
  const r = trackEl.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  if (audioReady && audio.duration){
    audio.currentTime = ratio * audio.duration;      // 有音频：拖动即解码定位
    manualUntil = performance.now() + 350;
    return;
  }
  setPlaying(false);
  setIndex(Math.round(ratio * (N - 1)));
});

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (typing) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); setPlaying(false); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); setPlaying(false); prev(); }
  else if (e.key === ' '){ e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'Home'){ e.preventDefault(); setPlaying(false); setIndex(0); seekTo(0); }
  else if (e.key === 'End'){ e.preventDefault(); setPlaying(false); setIndex(N - 1); seekTo(N - 1); }
  else if (e.key === 't' || e.key === 'T'){ e.preventDefault(); recordTap(); }
  else if (e.key === 'l' || e.key === 'L'){ e.preventDefault(); toggleLoop(); }
  else if (e.key === '['){ OFFSET = +(OFFSET - 0.1).toFixed(2); saveTimeline(); renderStamps(); toast('偏移 ' + OFFSET.toFixed(1) + 's'); }
  else if (e.key === ']'){ OFFSET = +(OFFSET + 0.1).toFixed(2); saveTimeline(); renderStamps(); toast('偏移 ' + OFFSET.toFixed(1) + 's'); }
});

stage.addEventListener('wheel', () => { if (playing) setPlaying(false); }, {passive:true});

stage.addEventListener('scroll', () => {
  if (suppress) return;
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const mid = stage.scrollTop + stage.clientHeight / 2;
    let best = index, dist = Infinity;
    cards.forEach((c, k) => {
      if (c.style.display === 'none') return;
      const d = Math.abs(c.offsetTop + c.offsetHeight / 2 - mid);
      if (d < dist){ dist = d; best = k; }
    });
    if (best !== index) setIndex(best, {scroll:false});
  }, 140);
});

/* =========================================================
   3.5 动效层
   ========================================================= */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const GLYPHS  = '01<>{}[]()/*+-=%$#@!?;:~^&|\\アカサタナハマヤラワ';
const GLYPH_SIZE = 13, GLYPH_FONT = GLYPH_SIZE + 'px monospace';
let bodyHidden = false, scrambleHost = null;

/** 歌词解码：未解析的字符在乱码表里滚动，逐个落定 */
function typeEn(el, text){
  if (REDUCED){ cancelAnimationFrame(el._raf); el.textContent = text; return; }
  if (scrambleHost && scrambleHost !== el) cancelAnimationFrame(scrambleHost._raf);
  scrambleHost = el;
  cancelAnimationFrame(el._raf);

  const chars = Array.from(text);
  const PER = 14, HOLD = 170;                 // 每字符间隔 / 解码窗口
  el.textContent = '';
  const spans = chars.map(ch => {
    const s = document.createElement('span');
    s.className = 'ch';
    // 空格必须是普通空格：用 \u00a0 会让整句变成不可断行的长串，长歌词会溢出到代码区
    s.textContent = (ch === ' ') ? ' ' : GLYPHS[(Math.random() * GLYPHS.length) | 0];
    el.appendChild(s);
    return s;
  });

  const total = (chars.length - 1) * PER + HOLD + 120;
  const t0 = performance.now();
  let frame = 0;
  const step = now => {
    const dt = now - t0;
    frame++;
    for (let i = 0; i < chars.length; i++){
      const s = spans[i];
      if (chars[i] === ' '){ s.classList.add('done'); continue; }
      const start = i * PER;
      if (dt >= start + HOLD){
        if (!s.classList.contains('done')){
          s.classList.remove('live');
          s.classList.add('done');
          s.textContent = chars[i];
        }
      } else if (dt >= start){
        if (!s.classList.contains('live')) s.classList.add('live');
        if (frame % 2 === 0) s.textContent = GLYPHS[(Math.random() * GLYPHS.length) | 0];
      }
    }
    if (dt < total) el._raf = requestAnimationFrame(step);
    else spans.forEach((s, i) => {
      s.classList.remove('live');
      s.classList.add('done');
      s.textContent = chars[i];              // 空格保持普通空格，否则折行会失效
    });
  };
  el._raf = requestAnimationFrame(step);
}

/**
 * 代码打字机：
 * 首次激活时把每行代码切成逐字符 span（缓存在 codeEl._chars，只算一次），
 * 之后每帧把字符从 hide 里放出来，并把"方块光标"推到写指针处。
 */
function buildChars(codeEl){
  if (codeEl._chars) return codeEl._chars;
  const walker = document.createTreeWalker(codeEl, NodeFilter.SHOW_TEXT, null);
  const texts = [];
  let node;
  while ((node = walker.nextNode())) if (node.nodeValue) texts.push(node);

  const chars = [];
  texts.forEach(tn => {
    const frag = document.createDocumentFragment();
    for (const ch of tn.nodeValue){
      if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r'){   // 空白不参与动画
        frag.appendChild(document.createTextNode(ch));
        continue;
      }
      const s = document.createElement('span');
      s.className = 'ch hide';
      s.textContent = ch;
      frag.appendChild(s);
      chars.push(s);
    }
    tn.parentNode.replaceChild(frag, tn);
  });
  codeEl._chars = chars;
  return chars;
}

function typeCode(codeEl, charCount){
  if (!codeEl) return;
  const chars = buildChars(codeEl);
  const n = chars.length;
  const pre = codeEl.parentElement;               // pre.code，可滚动的那个
  cancelAnimationFrame(codeEl._typeRaf);
  clearTimeout(codeEl._settle);

  if (REDUCED || n === 0){
    for (const c of chars) c.classList.remove('hide');
    return;
  }
  for (const c of chars) c.classList.add('hide');

  const dur = Math.min(1500, Math.max(650, charCount * 2.2));
  const t0 = performance.now();
  let i = 0, head = null, fno = 0;

  const frame = now => {
    const target = Math.min(n, Math.ceil((now - t0) / dur * n));
    for (; i < target; i++) chars[i].classList.remove('hide');
    if (head) head.classList.remove('head');
    head = null;
    if (i < n){
      head = chars[i];
      head.classList.add('head');
      if ((fno++ & 3) === 0) followHead(pre, head);      // 光标出界就把代码区带着滚
      codeEl._typeRaf = requestAnimationFrame(frame);
    } else {
      // 写完停一下再回到顶部，方便从头读；卡片已经切走就不动它
      codeEl._settle = setTimeout(() => {
        if (pre && pre.closest('.card').classList.contains('active')){
          pre.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }, 600);
    }
  };
  codeEl._typeRaf = requestAnimationFrame(frame);
}

/**
 * 预切字符：把后面几张卡的逐字 span 提前在空闲时段建好。
 * buildChars 一次要 createElement 上千个节点，放在切句的瞬间会造成掉帧。
 */
const idle = window.requestIdleCallback || (fn => setTimeout(() => fn({ timeRemaining: () => 8 }), 120));
function warmUp(from){
  const targets = [from + 1, from + 2, from - 1].filter(k => k >= 0 && k < N);
  let idx = 0;
  const pump = deadline => {
    let built = 0;
    while (idx < targets.length && built < 2){
      const codeEl = cards[targets[idx]].querySelector('code');
      if (codeEl && !codeEl._chars) buildChars(codeEl);
      idx++; built++;
      if (deadline && deadline.timeRemaining && deadline.timeRemaining() < 2) break;
    }
    if (idx < targets.length) idle(pump);
  };
  idle(pump);
}

/** 让方块光标留在代码可视区内 */
function followHead(pre, head){
  if (!pre || pre.scrollHeight <= pre.clientHeight + 4) return;
  const hr = head.getBoundingClientRect(), pr = pre.getBoundingClientRect();
  if (hr.bottom > pr.bottom - 14) pre.scrollTop += (hr.bottom - pr.bottom) + 44;
  else if (hr.top < pr.top + 8) pre.scrollTop -= (pr.top - hr.top) + 44;
}

/** SVG 自我绘制：描边路径"画"出来，填充图形弹出来，文字浮上来。
 *  先集中读几何、再集中写动画，避免逐个元素的读写交替造成强制重排。 */
function animateViz(card){
  const svg = card.querySelector('.viz svg');
  if (!svg) return;
  card._idles = [];                       // 记录本条卡上无限循环的虚线动画，切走时暂停
  const shapes = [...svg.querySelectorAll('path,line,polyline,polygon,circle,ellipse,rect')];
  if (REDUCED){
    for (const el of shapes) if (el._draw){ el._draw.cancel(); el._draw = null; }
    return;
  }
  // ---- 读阶段 ----
  // 判断"是描边还是填充"只看 class / 属性，不用 getComputedStyle ——
  // 后者对每个图形都强制解析一次样式，棋盘那种 64 格的图会明显掉帧。
  const plan = shapes.map(el => {
    const cls = el.getAttribute('class') || '';
    const stroked = /(^|\s)(s-|f-cell)/.test(cls) || el.hasAttribute('stroke');
    let len = 0;
    if (stroked){ try { len = el.getTotalLength(); } catch (e) { len = 0; } }
    return {
      el, stroked, len,
      marching: el.dataset.marching === '1' || el.classList.contains('dash'),
      spin: el.classList.contains('spin'),
      pulse: el.classList.contains('pulse')
    };
  });
  const texts = [...svg.querySelectorAll('text')];
  // ---- 写阶段 ----
  const n = plan.length;
  const stepMs = n > 60 ? 9 : n > 24 ? 16 : 26;
  plan.forEach((p, i) => {
    const el = p.el;
    if (el._draw) el._draw.cancel();
    if (el._idle){ el._idle.cancel(); el._idle = null; }
    const delay = i * stepMs;
    if (p.stroked && p.len > 0){
      if (p.marching){ el.dataset.marching = '1'; el.classList.remove('dash'); }
      el.style.strokeDasharray = p.len + ' ' + p.len;
      el.style.strokeDashoffset = p.len;
      const a = el.animate(
        [{ strokeDashoffset: p.len }, { strokeDashoffset: 0 }],
        { duration: 760, delay, easing: 'cubic-bezier(.25,.8,.3,1)', fill: 'both' });
      a.onfinish = () => {
        if (p.marching){
          el.style.strokeDasharray = '6 7';
          el.style.strokeDashoffset = '0';
          el._idle = el.animate(
            [{ strokeDashoffset: 0 }, { strokeDashoffset: -52 }],
            { duration: 2600, iterations: Infinity, easing: 'linear' });
          if (card._idles) card._idles.push(el._idle);
        } else {
          el.style.strokeDasharray = '';
          el.style.strokeDashoffset = '';
        }
        a.cancel();          // 终态与基础样式一致，取消即可，别留一堆 fill 动画
        el._draw = null;
      };
      el._draw = a;
    } else if (p.spin || p.pulse){
      const b = el.animate([{ opacity: 0 }, { opacity: 1 }],
        { duration: 420, delay, easing: 'ease-out', fill: 'both' });
      b.onfinish = () => { b.cancel(); el._draw = null; };
      el._draw = b;
    } else {
      const c = el.animate(
        [{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'scale(1)' }],
        { duration: 440, delay, easing: 'cubic-bezier(.2,.9,.25,1.25)', fill: 'both' });
      c.onfinish = () => { c.cancel(); el._draw = null; };
      el._draw = c;
    }
  });
  texts.forEach((el, i) => {
    if (el._draw) el._draw.cancel();
    const t = el.animate(
      [{ opacity: 0, transform: 'translateY(7px)' }, { opacity: 1, transform: 'none' }],
      { duration: 420, delay: 220 + i * 45, easing: 'ease-out', fill: 'both' });
    t.onfinish = () => { t.cancel(); el._draw = null; };
    el._draw = t;
  });
}

/* ---- 背景字符场 ---- */
const bgc  = document.getElementById('bgc');
const bctx = bgc && bgc.getContext('2d');
let glyphs = [], gw = 0, gh = 0;

function spawnGlyph(anywhere){
  return {
    x: Math.random() * gw,
    y: anywhere ? Math.random() * gh : -20,
    v: 0.10 + Math.random() * 0.34,
    size: GLYPH_SIZE,
    a: 0.04 + Math.random() * 0.18,
    ch: GLYPHS[(Math.random() * GLYPHS.length) | 0],
    flick: 60 + Math.random() * 320
  };
}

function resizeBg(){
  if (!bctx) return;
  const d = 1;                                  // 背景是装饰，锁 1x 省一半填充率
  gw = bgc.width  = Math.floor(innerWidth  * d);
  gh = bgc.height = Math.floor(innerHeight * d);
  bgc.style.width  = innerWidth + 'px';
  bgc.style.height = innerHeight + 'px';
  const count = Math.max(20, Math.min(46, Math.floor(innerWidth / 34)));
  glyphs = Array.from({ length: count }, () => spawnGlyph(true));
  bctx.font = GLYPH_FONT;                       // 字体只设一次，不逐字重设
}
if (bctx){ resizeBg(); window.addEventListener('resize', resizeBg); }

function stepGlyphs(){
  if (!bctx || REDUCED || gw === 0 || bodyHidden) return;
  bctx.clearRect(0, 0, gw, gh);
  bctx.textBaseline = 'top';
  bctx.font = GLYPH_FONT;
  for (let i = 0; i < glyphs.length; i++){
    const g = glyphs[i];
    g.y += g.v * glyphHeat;
    if (g.y > gh + 24) Object.assign(g, spawnGlyph(false));
    if (--g.flick < 0){
      g.flick = 60 + Math.random() * 320;
      g.ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
    }
    bctx.fillStyle = 'hsla(' + bgHue.toFixed(0) + ',100%,70%,' + g.a.toFixed(3) + ')';
    bctx.fillText(g.ch, g.x, g.y);
  }
}

/* ---- 标题故障脉冲 ---- */
setInterval(() => {
  if (REDUCED || document.hidden) return;
  const h = document.querySelector('h1');
  if (!h) return;
  h.classList.remove('glitch');
  void h.offsetWidth;
  h.classList.add('glitch');
}, 9000);

/* ---- 启动 ---- */
/* 把 86 句的情绪曲线画进进度条，一眼看到整首歌的起伏和高潮位置 */
(function drawHeatCurve(){
  const line = document.getElementById('heatline');
  if (!line) return;
  if (HEAT.length !== N) HEAT.length = N;
  const pts = HEAT.map((h, i) => (i + 0.5).toFixed(1) + ',' + (19 - h * 16).toFixed(1));
  line.setAttribute('points', pts.join(' '));
})();
/* 支持 ?n=34 直接跳到第 34 句，便于分享某一句 */
const qLine = parseInt(new URLSearchParams(location.search).get('n') || '', 10);
const startLine = Number.isFinite(qLine) ? Math.min(N - 1, Math.max(0, qLine - 1)) : 0;
setIndex(startLine, {scroll:false});
loadTimeline();
renderStamps();
startSync();
if (startLine > 0) setTimeout(() => scrollCardToTop(cards[startLine], true), 120);

const bundledEl = document.getElementById('bundledAudio');
if (bundledEl && bundledEl.textContent.replace(/\s+/g, '').length > 1000){
  toast('正在解包内置音频…');
  setTimeout(() => loadBundled(bundledEl), 40);   // 先让首帧渲染出来
} else if (/^https?:$/.test(location.protocol) || location.protocol === 'file:'){
  trySidecar();                                   // 同目录的 audio.mp3
} else {
  setPlaying(true);
}
</script>
